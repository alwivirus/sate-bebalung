<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <rect width="200" height="200" rx="16" fill="#FDFBF7"/>
    <g transform="translate(60, 8)">
        <text x="40" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="7" fill="#111827" text-anchor="middle">DEPOT Sate</text>
        <text x="40" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="5" fill="#D97706" text-anchor="middle">Sop &amp; Gulai Kambing</text>
        <text x="40" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="5.5" fill="#EA580C" text-anchor="middle">"BE BA LUNG"</text>
    </g>
    <!-- Bento Plate / Banana Leaf Liner -->
    <ellipse cx="100" cy="115" rx="75" ry="52" fill="#15803D"/>
    <!-- Steamed Rice in Cone/Dome shape (Nasi Timbel / Putih) -->
    <circle cx="75" cy="110" r="24" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <circle cx="75" cy="110" r="2" fill="#B45309"/><!-- Fried onion on rice -->
    <!-- Mini Sate on Side -->
    <line x1="105" y1="130" x2="150" y2="105" stroke="#D7CCC8" stroke-width="2"/>
    <line x1="108" y1="138" x2="155" y2="112" stroke="#D7CCC8" stroke-width="2"/>
    <circle cx="120" cy="120" r="5" fill="#4E342E"/>
    <circle cx="132" cy="114" r="5" fill="#3E2723"/>
    <circle cx="124" cy="128" r="5" fill="#4E342E"/>
    <circle cx="136" cy="122" r="5" fill="#3E2723"/>
    <!-- Sambal & Kerupuk -->
    <ellipse cx="98" cy="140" rx="8" ry="5" fill="#DC2626"/>
    <circle cx="140" cy="92" r="10" fill="#FEF08A" stroke="#EAB308" stroke-width="1"/>
</svg>
