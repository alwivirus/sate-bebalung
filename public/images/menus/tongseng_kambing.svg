<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <rect width="200" height="200" rx="16" fill="#FDFBF7"/>
    <!-- Logo Badge -->
    <g transform="translate(60, 8)">
        <text x="40" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="7" fill="#111827" text-anchor="middle">DEPOT Sate</text>
        <text x="40" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="5" fill="#D97706" text-anchor="middle">Sop &amp; Gulai Kambing</text>
        <text x="40" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="5.5" fill="#EA580C" text-anchor="middle">"BE BA LUNG"</text>
    </g>
    <!-- Ceramic Bowl -->
    <ellipse cx="100" cy="115" rx="72" ry="55" fill="#F5F5F5" stroke="#4B5563" stroke-width="2.5"/>
    <ellipse cx="100" cy="105" rx="65" ry="42" fill="#5D4037"/>
    <!-- Tongseng Broth (Rich savory brown-yellow santan) -->
    <ellipse cx="100" cy="105" rx="60" ry="38" fill="#4E342E"/>
    <!-- Meat chunks, Cabbage, Tomatoes, Chilis -->
    <circle cx="85" cy="98" r="10" fill="#3E2723"/>
    <circle cx="112" cy="102" r="11" fill="#3E2723"/>
    <circle cx="100" cy="115" r="9" fill="#2E1C14"/>
    <!-- Cabbage (Kol) -->
    <path d="M 75 110 Q 88 120 78 125" stroke="#C8E6C9" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 115 112 Q 128 118 120 125" stroke="#C8E6C9" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Sliced Tomatoes & Chili -->
    <circle cx="95" cy="92" r="6" fill="#EF4444"/>
    <circle cx="120" cy="95" r="4" fill="#DC2626"/>
    <circle cx="78" cy="96" r="3" fill="#4CAF50"/>
</svg>
