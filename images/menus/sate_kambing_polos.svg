<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <!-- White background with subtle vignette -->
    <rect width="200" height="200" rx="16" fill="#FDFBF7"/>
    
    <!-- Depot Be Ba Lung Mini Badge on top -->
    <g transform="translate(60, 8)">
        <text x="40" y="10" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="7" fill="#111827" text-anchor="middle">DEPOT Sate</text>
        <text x="40" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="5" fill="#D97706" text-anchor="middle">Sop &amp; Gulai Kambing</text>
        <text x="40" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="5.5" fill="#EA580C" text-anchor="middle">"BE BA LUNG"</text>
    </g>

    <!-- Wooden Tray / Slate Board -->
    <rect x="25" y="45" width="150" height="140" rx="12" fill="#3E2723" transform="rotate(-3 100 115)"/>
    <rect x="30" y="50" width="140" height="130" rx="10" fill="#2E1C14" transform="rotate(-3 100 115)"/>

    <!-- Small Bowls: Sambal Kecap & Bawang Tomat -->
    <!-- Peanut Sauce Bowl -->
    <circle cx="85" cy="72" r="22" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="1.5"/>
    <circle cx="85" cy="72" r="18" fill="#8D5B4C"/>
    <path d="M 75 70 Q 85 64 95 72 Q 85 80 75 70" fill="#6D4C41"/>

    <!-- Sliced Shallots & Chili Bowl -->
    <circle cx="138" cy="78" r="20" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="1.5"/>
    <circle cx="138" cy="78" r="16" fill="#FFF8E1"/>
    <!-- Shallots -->
    <circle cx="134" cy="76" r="4" fill="#BA68C8"/>
    <circle cx="142" cy="80" r="4" fill="#E91E63"/>
    <circle cx="138" cy="82" r="3" fill="#4CAF50"/>

    <!-- Black Plate with Sate Sticks -->
    <ellipse cx="95" cy="135" rx="55" ry="32" fill="#1C1917" stroke="#44403C" stroke-width="2"/>

    <!-- Bamboo Skewers -->
    <line x1="30" y1="170" x2="115" y2="120" stroke="#D7CCC8" stroke-width="2.5"/>
    <line x1="28" y1="162" x2="118" y2="115" stroke="#D7CCC8" stroke-width="2.5"/>
    <line x1="32" y1="178" x2="120" y2="125" stroke="#D7CCC8" stroke-width="2.5"/>
    <line x1="36" y1="184" x2="125" y2="130" stroke="#D7CCC8" stroke-width="2.5"/>

    <!-- Sate Meat Chunks (Succulent Charcoal Grilled) -->
    <g fill="#4E342E" stroke="#3E2723" stroke-width="1">
        <!-- Skewer 1 meat -->
        <circle cx="80" cy="138" r="7"/>
        <circle cx="92" cy="132" r="8" fill="#3E2723"/>
        <circle cx="105" cy="125" r="7"/>

        <!-- Skewer 2 meat -->
        <circle cx="75" cy="132" r="7"/>
        <circle cx="88" cy="126" r="8"/>
        <circle cx="102" cy="118" r="8" fill="#2E1C14"/>

        <!-- Skewer 3 meat -->
        <circle cx="84" cy="146" r="7"/>
        <circle cx="98" cy="140" r="8"/>
        <circle cx="112" cy="132" r="7"/>

        <!-- Skewer 4 meat -->
        <circle cx="90" cy="154" r="7"/>
        <circle cx="104" cy="148" r="8"/>
        <circle cx="118" cy="140" r="7"/>
    </g>

    <!-- Glaze Sauce & Fried Shallots sprinkles -->
    <path d="M 72 130 Q 95 120 120 135" stroke="#8D6E63" stroke-width="3" fill="none" opacity="0.8"/>
    <circle cx="88" cy="130" r="1.5" fill="#FFB74D"/>
    <circle cx="96" cy="138" r="1.5" fill="#FFB74D"/>
    <circle cx="105" cy="128" r="1.5" fill="#FFB74D"/>

    <!-- Tomato slices and Lime garnish -->
    <!-- Tomato slice -->
    <ellipse cx="60" cy="142" rx="10" ry="7" fill="#EF4444" transform="rotate(-15 60 142)"/>
    <ellipse cx="60" cy="142" rx="7" ry="4" fill="#DC2626" transform="rotate(-15 60 142)"/>
    <!-- Lime slice -->
    <path d="M 125 152 A 9 9 0 0 0 142 152 Z" fill="#84CC16"/>
    <circle cx="133" cy="152" r="7" fill="#65A30D"/>
</svg>
