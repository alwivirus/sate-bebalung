    <rect x="104" y="65" width="20" height="20" rx="4" fill="#FFFFFF" opacity="0.8" stroke="#FDE68A" stroke-width="1.5"/>
    <rect x="85" y="92" width="24" height="24" rx="4" fill="#FFFFFF" opacity="0.75" stroke="#FDE68A" stroke-width="1.5"/>
