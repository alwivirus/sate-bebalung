    <text x="120" y="228" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DEPOT Sate</text>
    <text x="120" y="246" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#FBBF24" text-anchor="middle">Sop &amp; Gulai Kambing</text>
    <text x="120" y="268" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#F97316" text-anchor="middle" letter-spacing="0.5">"BE BA LUNG"</text>
